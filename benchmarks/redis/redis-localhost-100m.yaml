# Redis Localhost Benchmark - 100M Requests
# 긴 실행 시간으로 정확한 처리량 측정 + flex baseline 확인
#
# ⚠️ 2026-07 재측정: Redis 8.4 -> 8.8-alpine(공식 최신), io-threads 미설정(기본, 단일 스레드
# I/O) 유지 — Valkey와의 io-threads 유무 비교를 위해 이 버전은 스레드 없는 baseline 역할.
# io-threads 4 버전은 benchmarks/redis-io4/redis-io4-localhost-100m.yaml 참고.
#
# ⚠️ Test 5/6(--csv, 1M 요청 단발) 값은 대시보드에서 더 이상 headline throughput으로 쓰지
# 않음(redis-benchmark의 CSV 요약 durations이 0.25초 단위로만 반올림돼, 1M 요청처럼 짧은
# 구간에서는 다른 인스턴스끼리 같은 값으로 겹치는 양자화 노이즈가 심함 — 54개 인스턴스 중 unique
# 값이 30개뿐이었던 걸 실측으로 확인). 대신 Test 1(SET 1억 건)의 "overall" 진행률 로그 마지막
# 값을 지속 처리량으로 파싱한다(scripts/dashboard/parsers/redis.py 갱신) — Test 5/6은 latency
# percentile(min/p50/p95/p99/max) 값만 보조로 사용.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-100m-INSTANCE_SAFE-RUN_NUM
  namespace: benchmark
  labels:
    benchmark: redis-100m
    instance-type: "${INSTANCE_TYPE}"
    run: "RUN_NUM"
spec:
  ttlSecondsAfterFinished: 14400  # 4시간 (긴 벤치마크)
  backoffLimit: 0
  template:
    metadata:
      labels:
        benchmark: redis-100m
        instance-type: "${INSTANCE_TYPE}"
        run: "RUN_NUM"
    spec:
      restartPolicy: Never
      nodeSelector:
        node.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
      tolerations:
        - key: "benchmark"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: benchmark
                    operator: Exists
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: redis-benchmark
          image: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com/benchmark/redis:8.8-alpine
          resources: {}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              # Redis 설정 (io-threads 미설정 = 기본 단일 스레드 I/O)
              cat > /tmp/redis.conf << 'REDIS_CONF'
              bind 127.0.0.1
              port 6379
              protected-mode no
              daemonize yes
              pidfile /tmp/redis.pid
              logfile /tmp/redis.log
              maxmemory 0
              tcp-backlog 511
              tcp-keepalive 300
              save ""
              appendonly no
              REDIS_CONF

              echo "===== Redis 100M Benchmark ====="
              echo "Instance Type: ${INSTANCE_TYPE}"
              echo "Run: RUN_NUM"
              echo "Date: $(date -Iseconds)"
              echo ""

              # System Info
              echo "--- System Info ---"
              echo "CPU: $(nproc) cores"
              echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
              cat /proc/cpuinfo | grep "model name" | head -1 || echo "ARM processor"
              echo ""

              # Redis 서버 시작
              echo "--- Starting Redis Server ---"
              redis-server /tmp/redis.conf
              sleep 2

              if ! redis-cli ping | grep -q PONG; then
                echo "ERROR: Redis server failed to start"
                cat /tmp/redis.log
                exit 1
              fi
              echo "Redis server started"
              echo ""

              # Warmup (SET only, no threads)
              echo "--- Warmup ---"
              redis-benchmark -h 127.0.0.1 -t set -c 50 -n 100000 -q > /dev/null 2>&1
              echo "Warmup complete (100K SET requests)"
              echo ""

              # Test 1: SET 100M requests (main test - 지속 처리량 지표로 사용)
              echo "--- Test 1: SET 100M requests (50 clients, 3 threads) ---"
              echo "Start: $(date -Iseconds)"
              redis-benchmark -h 127.0.0.1 -t set -c 50 -n 100000000 --threads 3 -q
              echo "End: $(date -Iseconds)"
              echo ""

              # Test 2: GET 100M requests (지속 처리량 지표로 사용)
              echo "--- Test 2: GET 100M requests (50 clients, 3 threads) ---"
              echo "Start: $(date -Iseconds)"
              redis-benchmark -h 127.0.0.1 -t get -c 50 -n 100000000 --threads 3 -q
              echo "End: $(date -Iseconds)"
              echo ""

              # Test 3: SET with pipeline (10M - pipeline이 빨라서 줄임)
              echo "--- Test 3: SET Pipeline 10M requests (P=16) ---"
              echo "Start: $(date -Iseconds)"
              redis-benchmark -h 127.0.0.1 -t set -c 50 -n 10000000 --threads 3 -P 16 -q
              echo "End: $(date -Iseconds)"
              echo ""

              # Test 4: High concurrency SET 100M
              echo "--- Test 4: SET High Concurrency 100M (100 clients) ---"
              echo "Start: $(date -Iseconds)"
              redis-benchmark -h 127.0.0.1 -t set -c 100 -n 100000000 --threads 3 -q
              echo "End: $(date -Iseconds)"
              echo ""

              # Test 5: Latency percentile 참고용(1M, --csv) — throughput 지표로는 미사용
              echo "--- Test 5: Latency Test SET 1M ---"
              redis-benchmark -h 127.0.0.1 -t set -c 50 -n 1000000 --threads 3 --csv
              echo ""

              # Test 6: Latency percentile 참고용 GET
              echo "--- Test 6: Latency Test GET 1M ---"
              redis-benchmark -h 127.0.0.1 -t get -c 50 -n 1000000 --threads 3 --csv
              echo ""

              echo "===== Benchmark Complete ====="
              echo "End Time: $(date -Iseconds)"

              # Redis 종료
              redis-cli shutdown nosave || true
