# Spring Boot Benchmark Job (wrk)
# HTTP Throughput 측정 - wrk를 사용하여 Spring Boot 서버 성능 테스트
---
apiVersion: batch/v1
kind: Job
metadata:
  name: springboot-benchmark-INSTANCE_SAFE
  namespace: benchmark
  labels:
    benchmark: springboot-benchmark
    instance-type: "${INSTANCE_TYPE}"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    metadata:
      labels:
        benchmark: springboot-benchmark
        instance-type: "${INSTANCE_TYPE}"
    spec:
      restartPolicy: Never
      # wrk runs on benchmark-client nodepool (c6in.8xlarge in zone c)
      nodeSelector:
        node-type: benchmark-client
      tolerations:
        - key: benchmark-client
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: springboot-server
                  instance-type: "${INSTANCE_TYPE}"
              topologyKey: "topology.kubernetes.io/zone"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: benchmark
                    operator: Exists
              topologyKey: "kubernetes.io/hostname"
      initContainers:
        - name: wait-for-springboot
          image: public.ecr.aws/docker/library/alpine:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Spring Boot server..."
              until wget -q --spider http://springboot-server-INSTANCE_SAFE:8080/ 2>/dev/null; do
                echo "Still waiting..."
                sleep 5
              done
              echo "Spring Boot server is ready!"
          env:
            - name: INSTANCE_TYPE
              value: "${INSTANCE_TYPE}"
      containers:
        - name: benchmark
          image: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com/benchmark/wrk:latest
          resources:
            requests:
              cpu: "1500m"
              memory: "4Gi"
          command:
            - /bin/sh
            - -c
            - |
              SPRINGBOOT_HOST="springboot-server-INSTANCE_SAFE"

              # 클라이언트 노드 샘플러(2026-11 추가): wrk는 closed-loop라 클라이언트가 순간 멈추면 처리량이 조용히
              # 줄어든다 — 노드 CPU%를 1초 간격으로 기록해 클라이언트 병목/경합 여부를 사후 판정. 출력은 맨 끝
              # (Benchmark Complete 뒤)에만 붙여 기존 파서(섹션 경계 '--- ')에 영향 없음.
              ( set -- $(awk '/^cpu /{t=0; for(i=2;i<=NF;i++) t+=$i; print t, $5+$6}' /proc/stat); pt=$1; pi=$2
                while sleep 1; do set -- $(awk '/^cpu /{t=0; for(i=2;i<=NF;i++) t+=$i; print t, $5+$6}' /proc/stat)
                  echo "$(date +%s) $(awk -v dt=$(($1-pt)) -v di=$(($2-pi)) 'BEGIN{ if (dt>0) printf "%.1f", (1-di/dt)*100 }')"; pt=$1; pi=$2
                done ) > /tmp/client-cpu.txt 2>/dev/null &
              CLIENT_SAMPLER=$!

              echo "===== Spring Boot Benchmark (wrk) ====="
              echo "Instance Type: ${INSTANCE_TYPE}"
              echo "Spring Boot Host: ${SPRINGBOOT_HOST}"
              echo ""

              # Warm-up (JIT compilation)
              echo "--- Warm-up Phase (30s) ---"
              wrk -t2 -c50 -d30s http://${SPRINGBOOT_HOST}:8080/ > /dev/null 2>&1
              echo "Warm-up complete"
              echo ""

              # Main page test
              echo "--- Main Page - 2 threads, 50 connections, 60s ---"
              wrk -t2 -c50 -d60s --latency http://${SPRINGBOOT_HOST}:8080/
              echo ""

              echo "--- Main Page - 2 threads, 100 connections, 60s ---"
              wrk -t2 -c100 -d60s --latency http://${SPRINGBOOT_HOST}:8080/
              echo ""

              # High load test
              echo "--- High Load - 2 threads, 200 connections, 30s ---"
              wrk -t2 -c200 -d30s --latency http://${SPRINGBOOT_HOST}:8080/
              echo ""

              echo "===== Spring Boot Benchmark Complete ====="
              kill $CLIENT_SAMPLER 2>/dev/null
              echo "CLIENT_NODE: ${CLIENT_NODE}"
              sed 's/^/CLIENT_CPU: /' /tmp/client-cpu.txt
          env:
            - name: INSTANCE_TYPE
              value: "${INSTANCE_TYPE}"
            - name: CLIENT_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
