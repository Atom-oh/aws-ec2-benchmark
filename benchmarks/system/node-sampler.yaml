# 벤치마크 노드 샘플러 (DaemonSet) — 부하 중 CPU 클럭과 노드 CPU 사용률을 1초 간격으로 stdout에 기록.
# graviton-intel-springboot-benchmark.pdf의 "부하 중 클럭"(Intel cpu MHz 중앙값)과 서버 CPU 사용률 근거를
# 우리 측정에도 남기기 위함. scripts/collect-node-sampler.sh가 로그를 주기적으로 results/node-sampler/에 저장한다.
#
# - 권한 상승·hostPath 없음. /proc/cpuinfo, /proc/stat은 PID/마운트 네임스페이스와 무관하게 노드 전체 값이다.
# - `benchmark` 라벨을 붙이지 않는다 → 벤치마크 Pod의 podAntiAffinity(benchmark Exists)에 걸리지 않음.
# - Graviton은 /proc/cpuinfo에 cpu MHz가 없다(고정 클럭 — EC2 SustainedClockSpeedInGhz가 실제 클럭). mhz=NA로 기록.
# - 출력 한 줄: ts=<epoch> node=<nodeName> mhz_med=<중앙값> mhz_min=<최소> mhz_max=<최대> util=<노드 CPU 사용률 %>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-sampler
  namespace: benchmark
  labels:
    app: node-sampler
spec:
  selector:
    matchLabels:
      app: node-sampler
  template:
    metadata:
      labels:
        app: node-sampler
    spec:
      nodeSelector:
        node-pool: benchmark-server
      # 측정 대상 타입에만 붙인다 — 다른 세션의 장시간 측정(sb-flex48/sb-traffic48 등) 노드에 간섭하지 않기 위함.
      # 다른 타입을 측정할 때는 이 목록에 추가하고 다시 apply.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["c9g.xlarge", "c8g.xlarge", "c7i.xlarge", "c7i-flex.xlarge", "c8i.xlarge"]
      tolerations:
        - key: "benchmark"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 1
      containers:
        - name: sampler
          image: public.ecr.aws/docker/library/alpine:3.20
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              read_stat(){ awk '/^cpu /{idle=$5+$6; t=0; for(i=2;i<=NF;i++) t+=$i; print t, idle}' /proc/stat; }
              set -- $(read_stat); pt=$1; pi=$2
              while true; do
                sleep 1
                set -- $(read_stat); t=$1; i=$2
                dt=$((t-pt)); di=$((i-pi)); pt=$t; pi=$i
                util=$(awk -v dt=$dt -v di=$di 'BEGIN{ if (dt>0) printf "%.1f", (1-di/dt)*100; else print "NA" }')
                mhz=$(awk -F: '/^cpu MHz/{gsub(/ /,"",$2); print $2}' /proc/cpuinfo | sort -n | awk '{a[NR]=$1} END{ if (NR==0) print "NA NA NA"; else printf "%s %s %s", a[int((NR+1)/2)], a[1], a[NR] }')
                set -- $mhz
                echo "ts=$(date +%s) node=${NODE_NAME} mhz_med=$1 mhz_min=$2 mhz_max=$3 util=${util}"
              done
