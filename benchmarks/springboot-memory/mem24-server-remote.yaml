# Spring Boot 메모리 부하 서버 — 목표 힙 24GB(-Xms=-Xmx) + 상주 캐시 12GB(엔트리 4KB) + 운영형 요청(/process), G1GC.
# 운영에서 메모리가 부족해 GC가 도는 상황 재현: 상주 데이터 + 느린 하위 시스템 때문에 처리 중 요청이 쌓이며 힙이 찬다.
# 메모리가 부족한 인스턴스는 탈락시키지 않고 힙·캐시를 줄여 "GC가 계속 도는" 상태로 측정한다(기동 스크립트가 계산):
#   힙 = min(목표 힙, RAM - 2.5GB),  상주 캐시 = min(목표 캐시, 힙 x 50%)  — 남은 힙을 처리 중 요청의 작업 객체가 채운다.
#   커넥션이 늘면 처리 중 요청(=작업 객체 1MB씩)이 쌓여 힙이 차고 GC가 압박받는다. 기동 로그 MEMORY_PLAN과 /version에 실제 값을 남긴다.
# -XX:+AlwaysPreTouch: 힙을 기동 시 실제로 확보(메모리가 실제로 꽉 찬 상태).
# -XX:+ExitOnOutOfMemoryError: OOM 시 프로세스 종료 → 컨테이너 재시작(재시작 횟수는 server.log). 없으면 Tomcat
#   내부 스레드만 OOM으로 죽고 JVM은 살아 남아, 이후 회차가 응답 없는 서버를 기다리다 타임아웃된다(2026-11-05 실제 발생).
# JVM은 그 외 기본값(Tiered 켜짐 — 운영 기본). 실행:
#   SERVER_READY_TIMEOUT=600 scripts/generate-cache-remote-benchmark.sh sbmem24 \
#     benchmarks/springboot-memory/mem24-server-remote.yaml benchmarks/springboot-memory/mem-benchmark-remote.yaml sbmem24-server 5 <az>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbmem24-remote-INSTANCE_SAFE
  namespace: benchmark
  labels:
    app: sbmem24-server
    benchmark: sbmem24
    instance-type: "${INSTANCE_TYPE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sbmem24-server
      instance-type: "${INSTANCE_TYPE}"
  template:
    metadata:
      labels:
        app: sbmem24-server
        benchmark: sbmem24
        instance-type: "${INSTANCE_TYPE}"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
        topology.kubernetes.io/zone: "${AZ}"
      tolerations:
        - key: "benchmark"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: benchmark
                    operator: Exists
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: server
          image: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com/benchmark/springboot-memory:1.2
          resources: {}
          env:
            - name: TARGET_HEAP_MB
              value: "24576"
            - name: TARGET_LIVE_MB
              value: "12288"
            - name: ENTRY_KB
              value: "4"
            # 운영형 요청(/process): 64KB 본문을 1MB 작업 객체로 펼쳐 1초간 유지(느린 하위 시스템) — 처리 중 요청 수만큼 힙 사용 증가
            - name: WORK_KB
              value: "1024"
            - name: HOLD_MS
              value: "1000"
          command:
            - /bin/sh
            - -c
            - |
              RAM_MB=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
              CAP=$((RAM_MB - 2560))  # JVM 비힙(메타스페이스·스레드 스택·코드캐시)·OS 여유 2.5GB
              HEAP=$TARGET_HEAP_MB; [ "$CAP" -lt "$HEAP" ] && HEAP=$CAP
              LIVE=$TARGET_LIVE_MB; [ $((HEAP * 50 / 100)) -lt "$LIVE" ] && LIVE=$((HEAP * 50 / 100))
              FIT=full; [ "$HEAP" -lt "$TARGET_HEAP_MB" ] && FIT=reduced
              echo "MEMORY_PLAN ram_mb=$RAM_MB heap_mb=$HEAP live_mb=$LIVE target_heap_mb=$TARGET_HEAP_MB target_live_mb=$TARGET_LIVE_MB fit=$FIT"
              export LIVE_SET_MB=$LIVE
              exec java -Xms${HEAP}m -Xmx${HEAP}m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+AlwaysPreTouch -XX:+ExitOnOutOfMemoryError -jar /app/app.jar
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 600
---
apiVersion: v1
kind: Service
metadata:
  name: sbmem24-remote-INSTANCE_SAFE
  namespace: benchmark
  labels:
    app: sbmem24-server
    instance-type: "${INSTANCE_TYPE}"
spec:
  selector:
    app: sbmem24-server
    instance-type: "${INSTANCE_TYPE}"
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
