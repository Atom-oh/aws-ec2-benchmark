# Spring Boot 메모리 부하 서버 — 힙 = RAM x 60%(-Xms=-Xmx, 프로젝트 공통 JVM 힙 비율) + 상주 캐시 = 전 인스턴스 동일 2GB(엔트리 4KB)
# + 운영형 요청(/process), G1GC. 힙을 RAM 비율로 정하므로 메모리가 큰 인스턴스(R)는 그만큼 큰 힙을 실제로 쓴다
# (2026-11-05 1차 설계는 힙을 12GB/24GB 절대값으로 고정해 R은 RAM의 39%만 써서 '메모리 크기'가 비교되지 않았음 → 폐기).
# 상주 데이터는 조건을 같게(고정 2GB — C 힙 4.6GB에도 처리 중 요청 몫 2.6GB가 남는 크기) 두고, 인스턴스 간 차이는 처리량이
# 늘며 쌓이는 작업 객체(1MB씩)만 만든다 → 메모리가 남는데 CPU가 차는지, 메모리가 차서 CPU가 남는지가 인스턴스별로 드러난다.
# (상주를 힙의 50%로 두면 R이 상주 데이터도 2배라 GC 작업량 조건이 달라져 가격 대비 처리량 비교가 안 됨 — 2026-11-05 사용자 지적.)
# 남은 힙(힙 - 상주)을 처리 중 요청의 작업 객체가 채운다. 클라이언트가 /version의 heap_max_mb·entries로
# 인스턴스별 '이론 최대 처리 중 요청 수'를 계산해 그 비율로 커넥션을 늘린다. 기동 로그 MEMORY_PLAN에 실제 값.
# -XX:+AlwaysPreTouch: 힙을 기동 시 실제로 확보(메모리가 실제로 꽉 찬 상태).
# -XX:+ExitOnOutOfMemoryError: OOM 시 프로세스 종료 → 컨테이너 재시작(재시작 횟수는 server.log). 없으면 Tomcat
#   내부 스레드만 OOM으로 죽고 JVM은 살아 남아, 이후 회차가 응답 없는 서버를 기다리다 타임아웃된다(2026-11-05 실제 발생).
# JVM은 그 외 기본값(Tiered 켜짐 — 운영 기본). 실행:
#   SERVER_READY_TIMEOUT=600 scripts/generate-cache-remote-benchmark.sh sbmem \
#     benchmarks/springboot-memory/mem-server-remote.yaml benchmarks/springboot-memory/mem-benchmark-remote.yaml sbmem-server 5 <az>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbmem-remote-INSTANCE_SAFE
  namespace: benchmark
  labels:
    app: sbmem-server
    benchmark: sbmem
    instance-type: "${INSTANCE_TYPE}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sbmem-server
      instance-type: "${INSTANCE_TYPE}"
  template:
    metadata:
      labels:
        app: sbmem-server
        benchmark: sbmem
        instance-type: "${INSTANCE_TYPE}"
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "${INSTANCE_TYPE}"
        topology.kubernetes.io/zone: "${AZ}"
      tolerations:
        - key: "benchmark"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: benchmark
                    operator: Exists
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: server
          image: 180294183052.dkr.ecr.ap-northeast-2.amazonaws.com/benchmark/springboot-memory:1.2
          resources: {}
          env:
            - name: HEAP_PCT
              value: "60"
            - name: LIVE_MB
              value: "2048"
            - name: ENTRY_KB
              value: "4"
            # 운영형 요청(/process): 본문(8KB)을 1MB 작업 객체로 펼쳐 HOLD_MS 동안 유지(느린 하위 시스템) — 처리 중 요청 수만큼 힙 사용 증가
            - name: WORK_KB
              value: "1024"
            # 하위 시스템 대기 10초: 1초면 처리 중 요청 수 = 초당 요청 수라 할당률(초당 GB)이 CPU를 먼저 포화시켜
            # '메모리가 꽉 차고 CPU가 남는' 상황이 안 됨(스모크 r6g: 이론치 50%에서 CPU 93%·GC 70%, 힙은 여유) → 같은 처리 중
            # 요청 수를 1/10 할당률로 만든다.
            - name: HOLD_MS
              value: "10000"
            # R(힙 ~19GB)은 처리 중 요청이 ~9,500까지 가므로 Tomcat 기본/앱 설정(10,000)보다 넉넉히
            - name: SERVER_TOMCAT_MAXCONNECTIONS
              value: "30000"
          command:
            - /bin/sh
            - -c
            - |
              RAM_MB=$(awk '/^MemTotal/{print int($2/1024)}' /proc/meminfo)
              HEAP=$((RAM_MB * HEAP_PCT / 100))
              LIVE=$LIVE_MB
              echo "MEMORY_PLAN ram_mb=$RAM_MB heap_mb=$HEAP live_mb=$LIVE heap_pct=$HEAP_PCT"
              export LIVE_SET_MB=$LIVE
              exec java -Xms${HEAP}m -Xmx${HEAP}m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+AlwaysPreTouch -XX:+ExitOnOutOfMemoryError -jar /app/app.jar
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 600
---
apiVersion: v1
kind: Service
metadata:
  name: sbmem-remote-INSTANCE_SAFE
  namespace: benchmark
  labels:
    app: sbmem-server
    instance-type: "${INSTANCE_TYPE}"
spec:
  selector:
    app: sbmem-server
    instance-type: "${INSTANCE_TYPE}"
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
